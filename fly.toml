# fly.toml -- Cantrell Creatives Voice Studio API
app = "cantrell-creatives"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[env]
  CORS_ORIGINS = "*"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
